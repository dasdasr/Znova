
config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 14
  LongMethod:
    active: true
    allowedLines: 60
  LongParameterList:
    active: true
    allowedFunctionParameters: 5
    allowedConstructorParameters: 6
    ignoreDataClasses: true
  LargeClass:
    active: true
    allowedLines: 600
  NestedBlockDepth:
    active: true
    allowedDepth: 4
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 15
    allowedFunctionsPerClass: 15

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: [ '-1', '0', '1', '2' ]
    ignoreHashCodeFunction: true
    ignoreConstantDeclaration: true
    ignorePropertyDeclaration: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  WildcardImport:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true

potential-bugs:
  active: true

exceptions:
  active: true

performance:
  active: true

empty-blocks:
  active: true

coroutines:
  active: true

comments:
  active: false
