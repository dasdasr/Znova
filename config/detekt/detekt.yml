config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 25
  LongMethod:
    active: true
    allowedLines: 90
  LongParameterList:
    active: true
    allowedFunctionParameters: 7
    allowedConstructorParameters: 8
    ignoreDataClasses: true
  LargeClass:
    active: true
    allowedLines: 800
  NestedBlockDepth:
    active: true
    allowedDepth: 5
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 30

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
  WildcardImport:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true

potential-bugs:
  active: true

exceptions:
  active: true

performance:
  active: true

empty-blocks:
  active: true

coroutines:
  active: true

comments:
  active: false
